# CI sigap-ui — 15-Checklist-Belum-Terimplementasi.md item K + temuan #7.
#
# Dipecah dari `.github/workflows/ci.yml` monorepo (2026-09-02). Versi lama itu
# tidak pernah ter-trigger: file-nya duduk di root monorepo yang bukan git repo,
# sementara tiap service adalah repo GitHub terpisah.
#
# Job `e2e` butuh backend juga, jadi dia mengambil repo `sigap-api` lewat
# checkout kedua ke subfolder. Repo itu publik, jadi tidak perlu token; kalau
# suatu saat dijadikan privat, tambahkan `token: ${{ secrets.<PAT> }}` di
# langkah checkout tersebut.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  API_REPO: developermagan9/sigap-api

jobs:
  ui:
    name: typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: e2e Playwright (API + UI + Postgres)
    # Tidak ada gunanya menyalakan seluruh stack kalau typecheck/build sudah merah.
    needs: [ui]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigap
          POSTGRES_PASSWORD: sigap_secret
          POSTGRES_DB: sigap_bansos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigap -d sigap_bansos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sigap:sigap_secret@localhost:5432/sigap_bansos?schema=public
      JWT_SECRET: ci-jwt-secret
      # Nilai uji, bukan rahasia produksi — panjangnya harus tepat karena dipakai
      # sebagai kunci AES-256 (32 byte hex) di common/crypto.util.ts.
      SYSTEM_PEPPER: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
      DB_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1

    steps:
      # Urutan penting: checkout tanpa `path` membersihkan seluruh workspace,
      # jadi repo UI harus diambil lebih dulu, baru API ke subfolder.
      - uses: actions/checkout@v4

      - name: Checkout sigap-api
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPO }}
          ref: main
          path: sigap-api

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install & siapkan API
        working-directory: sigap-api
        run: |
          npm ci
          npx prisma db push --skip-generate
          npx prisma generate
          npm run prisma:seed
          npm run build

      - name: Jalankan API
        working-directory: sigap-api
        run: |
          node dist/src/main &
          npx wait-on -t 60000 http://localhost:3001/health

      - name: Install & build UI
        run: |
          npm ci
          npm run build

      - name: Jalankan UI
        run: |
          npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000

      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
