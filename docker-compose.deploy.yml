# ─────────────────────────────────────────────────────────────────────────────
#  Compose khusus DEPLOY dari Jenkins untuk SIGAP-Bansos UI — bukan dev lokal.
#
#  Image `sigap-ui` sudah dibangun stage "Docker image" di Jenkinsfile (lengkap
#  dengan NEXT_PUBLIC_API_URL yang sudah di-inline), jadi di sini TIDAK ada
#  `build:` — cukup referensi tag lewat $IMAGE_TAG (fallback `latest`).
#
#  FE bicara ke API lewat IP publik (http://43.133.144.108:3001/v1) langsung dari
#  browser, jadi container ini TIDAK perlu jaringan bersama dengan sigap-api.
# ─────────────────────────────────────────────────────────────────────────────
services:
  sigap-ui:
    image: sigap-ui:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    healthcheck:
      # Pakai `node` (pasti ada di image) alih-alih wget/curl, dan cek status
      # code eksplisit. /health = route handler statis (app/health/route.ts),
      # TIDAK menyentuh API backend — route "/" dihindari karena dia Server
      # Component yang fetch ke backend saat render.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
